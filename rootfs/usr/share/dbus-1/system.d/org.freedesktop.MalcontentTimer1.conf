<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
  <!-- Allow the daemon to own its name. -->
  <policy user="malcontent-timerd">
    <allow own="org.freedesktop.MalcontentTimer1"/>
  </policy>

  <!-- Allow normal applications to use the timer API. -->
  <policy context="default">
    <allow send_destination="org.freedesktop.MalcontentTimer1"/>
  </policy>
</busconfig>

