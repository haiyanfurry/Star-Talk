# ╔══════════════════════════════════════════════════════════════════════╗
# ║    Star-Talk / 星语 — /boot.cfg                                    ║
# ║    NetBSD x86 Bootloader Configuration                              ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# This file is read by the NetBSD bootloader (bootx64.efi / boot).
# It defines boot menu entries and kernel parameters.
#
# Reference: boot.cfg(5) — NetBSD manual

banner=>> Star-Talk / 星语 — NetBSD Boot Menu
banner=>> Copyright (C) 2026 Hai Yan. All rights reserved.
banner=>>
banner=>> Select boot option:

# Clear screen before drawing menu
clear=1

# ── Default boot option ───────────────────────────────────────────────
menu=Star-Talk (default):load /netbsd; boot
menu=Star-Talk (verbose):load /netbsd; boot -v
menu=Star-Talk (single user):load /netbsd; boot -s
menu=Star-Talk (no ACPI):load /netbsd; boot -2
menu=Star-Talk (disable SMP):load /netbsd; boot -1
menu=Star-Talk (drop to boot prompt):prompt
menu=Star-Talk (power off):quit

# ── Default selection (5 seconds) ─────────────────────────────────────
default=1
timeout=50

# ── Load kernel modules at boot ──────────────────────────────────────
# Most modules are auto-loaded by the kernel. List only essential ones.
load=ffs
load=tmpfs
