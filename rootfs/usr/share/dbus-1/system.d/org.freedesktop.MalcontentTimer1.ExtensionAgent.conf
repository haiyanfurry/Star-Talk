<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
  <!-- Allow the daemon to own its name. -->
  <policy user="malcontent-timer-ext-agent">
    <allow own="org.freedesktop.MalcontentTimer1.ExtensionAgent"/>
  </policy>

  <!-- Allow only the timer daemon to use the agent API. -->
  <policy user="malcontent-timerd">
    <allow send_destination="org.freedesktop.MalcontentTimer1.ExtensionAgent"/>
  </policy>
</busconfig>

