# ╔══════════════════════════════════════════════════════════════╗
# ║     Star-Talk / 星语 — Foot Terminal Configuration          ║
# ║     Catppuccin Mocha Theme                                 ║
# ╚══════════════════════════════════════════════════════════════╝

[main]
# ── Font ──────────────────────────────────────────────────────
font = "JetBrains Mono:size=11"
font-italic = "JetBrains Mono:size=11"
font-bold = "JetBrains Mono:bold:size=11"
font-bold-italic = "JetBrains Mono:bold:italic:size=11"

# CJK fallback font
# (configured via fontconfig, not foot directly)

# ── Terminal ──────────────────────────────────────────────────
term = xterm-256color
shell = /bin/bash
login-shell = yes

# ── Geometry ──────────────────────────────────────────────────
pad = 8x8 center
initial-window-size-pixels = 800x600
initial-window-mode = windowed

# ── Cursor ────────────────────────────────────────────────────
cursor-style = bar
cursor-blink = yes

# ── Scrollback ────────────────────────────────────────────────
scrollback-lines = 10000

# ── Mouse ─────────────────────────────────────────────────────
mouse-scroll-multiplier = 1.0

# ── URL Detection ─────────────────────────────────────────────
url-launch = firefox
label-letters = jfkdlsahgurbvcnxmwoqpetyz
osc8-underline = url-mode

# ── Colors: Catppuccin Mocha ──────────────────────────────────
[colors]
alpha = 0.95
background = 1e1e2e
foreground = cdd6f4

## Normal/regular colors (color palette 0-7)
regular0  = 45475a   # surface1 (black)
regular1  = f38ba8   # red
regular2  = a6e3a1   # green
regular3  = f9e2af   # yellow
regular4  = 89b4fa   # blue
regular5  = f5c2e7   # pink
regular6  = 94e2d5   # teal
regular7  = bac2de   # subtext1 (white)

## Bright colors (color palette 8-15)
bright0   = 585b70   # surface2
bright1   = f38ba8   # red
bright2   = a6e3a1   # green
bright3   = f9e2af   # yellow
bright4   = 89b4fa   # blue
bright5   = f5c2e7   # pink
bright6   = 94e2d5   # teal
bright7   = a6adc8   # subtext0

## Dimmed colors
dim0      = 313244   # surface0
dim1      = eba0ac   # maroon
dim2      = (regular2 * 0.8)
dim3      = (regular3 * 0.8)
dim4      = (regular4 * 0.8)
dim5      = (regular5 * 0.8)
dim6      = (regular6 * 0.8)
dim7      = 9399b2   # overlay2

## Misc colors
selection-foreground = cdd6f4
selection-background = 585b70
urls                  = 89b4fa

# ── Visual Bell ───────────────────────────────────────────────
[bell]
visible = yes
urgent  = yes
notify  = yes
flash   = no
command-notify = /usr/bin/notify-send "Bell" "Bell in ${window-title}"

# ── Keybindings ───────────────────────────────────────────────
[key-bindings]
# Scroll up/down
scrollback-up-page   = Shift+Page_Up
scrollback-down-page = Shift+Page_Down

# Font size
font-increase        = Ctrl+plus
font-decrease        = Ctrl+minus
font-reset           = Ctrl+0

# Clipboard
clipboard-copy       = Control+Shift+c XF86Copy
clipboard-paste      = Control+Shift+v XF86Paste

# Search scrollback
search-start         = Control+Shift+r

# Open URL
url-mode             = Control+Shift+u

# Spawn new terminal
spawn-terminal       = Control+Shift+n

# Fullscreen toggle
fullscreen           = F11
