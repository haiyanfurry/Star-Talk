# ╔══════════════════════════════════════════════════════════════════════╗
# ║    Star-Talk / 星语 — /etc/wscons.conf                             ║
# ║    Console and keyboard configuration                               ║
# ╚══════════════════════════════════════════════════════════════════════╝

# Use UTF-8 encoding for console (supports CJK characters)
encoding us.swapctrlcaps.utf8

# Keyboard map (US with some international keys)
# For CJK input, users configure their desktop (fcitx/ibus in KDE)
mapfile /usr/share/wscons/keymaps/pckbd.us.swapctrlcaps

# Set screen encoding to UTF-8
setvar encoding=utf8

# Font for framebuffer console
# The default Gallant font works well; larger fonts are available
font  /usr/share/wscons/fonts/ter-132n.fnt
