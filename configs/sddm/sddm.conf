# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Star-Talk / 星语 — SDDM Display Manager Configuration            ║
# ╚══════════════════════════════════════════════════════════════════════╝

[Autologin]
# Auto-login disabled by default (security conscious)
# Enable for kiosk/demo mode: Session=plasma, User=startalk
Session=
User=

[General]
DisplayServer=x11
# For KDE Plasma 6 / Wayland (future):
# DisplayServer=wayland
HaltCommand=/sbin/shutdown -p now
RebootCommand=/sbin/shutdown -r now
Numlock=on

[Theme]
Current=star-talk
# Fallback if custom theme not available
# Current=breeze

[Users]
MaximumUid=60000
MinimumUid=1000

[Wayland]
CompositorCommand=kwin_wayland
