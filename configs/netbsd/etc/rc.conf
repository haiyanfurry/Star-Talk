# ╔══════════════════════════════════════════════════════════════════════╗
# ║    Star-Talk / 星语 — /etc/rc.conf                                ║
# ║    NetBSD system runtime configuration                             ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# This file controls which services start at boot time.
# Structure follows NetBSD rc.d(8) conventions.

# ── Host identity ──────────────────────────────────────────────────────
hostname="startalk"
rc_configured=YES

# ── Core services (always enabled) ─────────────────────────────────────
syslogd=YES
cron=YES
devpubd=YES
wscons=YES
ttys=YES
inetd=NO                     # Not needed for desktop

# ── Filesystem services ────────────────────────────────────────────────
fsck_flags="-p"
critical_filesystems_local="OPT:/var"
clear_tmp=YES

# ── Networking ─────────────────────────────────────────────────────────
# DHCP on wired interfaces — explicit list or "auto" for all
dhcpcd=YES
dhcpcd_flags="-qM"
ifconfig_lo0="inet 127.0.0.1 netmask 255.0.0.0"

# Optional: static IP (uncomment and configure)
#ifconfig_wm0="inet 192.168.1.100 netmask 255.255.255.0"
#defaultroute="192.168.1.1"

# ── SSH (optional) ─────────────────────────────────────────────────────
sshd=NO                      # Change to YES to enable SSH server
sshd_flags="-4"              # IPv4 only

# ── D-Bus (required by KDE) ────────────────────────────────────────────
dbus=YES

# ── Display Manager (KDE SDDM) ─────────────────────────────────────────
sddm=YES                     # Start SDDM at boot for graphical login

# ── Anonymity services ─────────────────────────────────────────────────
# Tor and I2PD are PRE-INSTALLED but DISABLED by default.
# User must explicitly enable them + reboot or start manually:
#   sudo service tor start
#   sudo service i2pd start
tor=NO
i2pd=NO

# ── Star-Talk custom services ──────────────────────────────────────────
startalk_splash=YES          # AIX-style boot splash with hardware detection
startalk_motd=YES            # Custom Message-of-the-Day

# ── Security/Sandbox ───────────────────────────────────────────────────
pf=NO                        # Packet filter (firewall)
npf=NO                       # NPF firewall

# ── Power management ───────────────────────────────────────────────────
powerd=YES                   # CPU frequency scaling

# ── Time synchronization ────────────────────────────────────────────────
ntpdate=NO                   # Use ntpd instead
ntpd=YES

# ── Misc ────────────────────────────────────────────────────────────────
# Enable core dumps for debugging
savecore=YES
savecore_flags="-z"

# Start local daemons defined in /usr/local/etc/rc.d/
# (pkgsrc-installed services have their scripts here)
rcd_scripts="/usr/local/etc/rc.d"
